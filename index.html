<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Brain</title>
<style>
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface2: #f0ede6;
  --surface3: #e8e4db;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.13);
  --text: #1c1b18;
  --text2: #5a5955;
  --text3: #8a8880;
  --accent: #4a41b0;
  --accent-light: #eceafe;
  --accent2: #1a9870;
  --accent2-light: #e0f4ec;
  --accent3: #c95228;
  --accent3-light: #f9ebe6;
  --amber: #b07015;
  --amber-light: #f9ecda;
  --user-bg: #eceafe;
  --user-border: #c5c0f0;
  --ai-bg: #f0ede6;
  --ai-border: #d8d4cc;
  --r: 10px;
  --rs: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #181816;
    --surface: #232320;
    --surface2: #2a2a27;
    --surface3: #313130;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0ede6;
    --text2: #b0ada6;
    --text3: #807e78;
    --accent: #a8a2e8;
    --accent-light: #221e56;
    --accent2: #58c8a0;
    --accent2-light: #043328;
    --accent3: #ee9070;
    --accent3-light: #481808;
    --amber: #eda020;
    --amber-light: #3e2000;
    --user-bg: #221e56;
    --user-border: #4a41b0;
    --ai-bg: #2a2a27;
    --ai-border: #3a3a36;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.65;
}

/* ===== LAYOUT ===== */
#app { display: flex; height: 100vh; overflow: hidden; }
#sidebar {
  width: 260px; flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  transition: transform 0.22s ease; z-index: 100;
}
#main { flex: 1; overflow-y: auto; min-width: 0; }
#main-inner { padding: 1.75rem; max-width: 780px; }

/* ===== MOBILE ===== */
@media (max-width: 640px) {
  #sidebar {
    position: fixed; top:0; left:0; bottom:0;
    width: 82vw; max-width: 300px;
    transform: translateX(-100%);
    box-shadow: 3px 0 20px rgba(0,0,0,0.18);
  }
  #sidebar.open { transform: translateX(0); }
  #mobile-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  #menu-btn {
    background: none; border: none; font-size: 20px;
    cursor: pointer; color: var(--text); padding: 2px 5px;
  }
  #mobile-bar-title { font-size: 14px; font-weight: 600; }
  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.38); z-index: 90;
  }
  #overlay.open { display: block; }
  #main-inner { padding: 14px; }
}
@media (min-width: 641px) {
  #mobile-bar, #overlay { display: none !important; }
}

/* ===== SIDEBAR ===== */
.sb-head {
  padding: 1.1rem 1rem 0.7rem; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.sb-head h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
.sb-head p { font-size: 11px; color: var(--text3); margin-top: 2px; }
.sb-search { padding: 7px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sb-search input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--rs); padding: 6px 10px; font-size: 12px; color: var(--text); outline: none;
}
.sb-search input:focus { border-color: var(--accent); }
.sb-search input::placeholder { color: var(--text3); }
#sb-nav { flex: 1; overflow-y: auto; padding: 6px 0 12px; }

.nav0 {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px; margin: 0 5px; border-radius: var(--rs);
  font-size: 11px; font-weight: 700; color: var(--text3);
  letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
}
.nav0:hover { background: var(--surface2); }
.nav0.active { background: var(--accent-light); color: var(--accent); }
.nav0 .cnt { margin-left: auto; font-size: 10px; font-weight: 400; background: var(--surface2); border-radius: 10px; padding: 1px 6px; }

.nav1 {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px 4px 20px; margin: 0 5px; border-radius: var(--rs);
  font-size: 13px; color: var(--text2); cursor: pointer;
}
.nav1:hover { background: var(--surface2); color: var(--text); }
.nav1.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
.nav1 .chev { font-size: 9px; color: var(--text3); transition: transform 0.14s; }
.nav1 .chev.open { transform: rotate(90deg); }
.nav1 .cnt { margin-left: auto; font-size: 10px; color: var(--text3); background: var(--surface2); border-radius: 10px; padding: 1px 6px; }

.nav2 {
  padding: 3px 10px 3px 32px; margin: 0 5px; border-radius: var(--rs);
  font-size: 12px; color: var(--text3); cursor: pointer;
}
.nav2:hover { background: var(--surface2); color: var(--text2); }
.nav2.active { background: var(--accent-light); color: var(--accent); }

.nav-children { display: none; }
.nav-children.open { display: block; }

/* ===== PAGE HEADER ===== */
.pg-header { margin-bottom: 1.25rem; }
.breadcrumb {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  font-size: 11px; color: var(--text3); margin-bottom: 7px;
}
.breadcrumb span { cursor: pointer; }
.breadcrumb span:hover { color: var(--accent); }
.breadcrumb .sep { opacity: 0.4; }
.pg-title { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 4px; }
.pg-sub { font-size: 13px; color: var(--text2); }

/* ===== CARDS ===== */
.grid { display: grid; gap: 10px; margin-bottom: 1.25rem; }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
@media (max-width: 640px) {
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 0.875rem 1rem; cursor: pointer;
  transition: border-color 0.13s, box-shadow 0.13s;
}
.card:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card.sel { border-color: var(--accent); background: var(--accent-light); }
.card-em { font-size: 22px; margin-bottom: 6px; }
.card-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.card-meta { font-size: 11px; color: var(--text3); margin-bottom: 5px; }
.card-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }

/* ===== TAGS ===== */
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag {
  font-size: 11px; padding: 2px 8px; border-radius: 20px;
  background: var(--accent-light); color: var(--accent);
  cursor: pointer; border: 1px solid transparent;
}
.tag:hover { border-color: var(--accent); }

/* ===== LOG LIST ===== */
.log-list { display: flex; flex-direction: column; gap: 5px; }
.log-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--rs); padding: 9px 12px;
  cursor: pointer; display: flex; align-items: flex-start; gap: 10px;
  transition: border-color 0.1s;
}
.log-row:hover { border-color: var(--border2); }
.log-date { font-size: 11px; color: var(--text3); white-space: nowrap; min-width: 68px; padding-top: 1px; }
.log-body { flex: 1; min-width: 0; }
.log-title {
  font-size: 13px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
}
.log-preview { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) {
  .log-row { flex-direction: column; gap: 2px; }
  .log-title { white-space: normal; }
  .log-date { min-width: unset; }
}

/* ===== RALLY VIEW ===== */
.conv-header { margin-bottom: 1.25rem; }
.conv-title { font-size: 20px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.35; margin-bottom: 6px; }
.conv-meta { font-size: 12px; color: var(--text3); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.conv-memberships { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.membership-chip {
  font-size: 11px; padding: 3px 9px; border-radius: 20px;
  background: var(--accent-light); color: var(--accent);
  cursor: pointer; border: 1px solid transparent;
}
.membership-chip:hover { border-color: var(--accent); }

/* Rally timeline */
.rally-timeline { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }

.rally-item {
  border: 1px solid var(--border); border-radius: var(--r);
  overflow: hidden; background: var(--surface);
}
.rally-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; cursor: pointer; gap: 10px;
  background: var(--surface2); border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.rally-header:hover { background: var(--surface3); }
.rally-num {
  font-size: 10px; font-weight: 700; color: var(--text3);
  background: var(--surface3); border-radius: 20px;
  padding: 2px 7px; white-space: nowrap; flex-shrink: 0;
}
.rally-summary { font-size: 12px; color: var(--text2); flex: 1; line-height: 1.5; }
.rally-toggle { font-size: 11px; color: var(--text3); white-space: nowrap; flex-shrink: 0; }
.rally-toggle.open { color: var(--accent); }

.rally-body { display: none; padding: 12px; }
.rally-body.open { display: block; }

.turn { margin-bottom: 10px; }
.turn:last-child { margin-bottom: 0; }
.turn-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; margin-bottom: 4px;
}
.turn-user .turn-label { color: var(--accent); }
.turn-ai .turn-label { color: var(--accent2); }
.turn-bubble {
  font-size: 13px; line-height: 1.7; padding: 10px 12px;
  border-radius: var(--rs); border: 1px solid; word-break: break-word;
}
.turn-user .turn-bubble { background: var(--user-bg); border-color: var(--user-border); }
.turn-ai .turn-bubble { background: var(--ai-bg); border-color: var(--ai-border); }

.rally-insight {
  margin-top: 10px; padding: 8px 12px;
  background: var(--amber-light); border: 1px solid rgba(176,112,21,0.2);
  border-radius: var(--rs); font-size: 12px; color: var(--text2);
}
.rally-insight strong { color: var(--amber); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 3px; }

/* Loading state */
.rally-loading {
  padding: 2rem; text-align: center; color: var(--text3); font-size: 13px;
}
.spinner {
  width: 20px; height: 20px; border: 2px solid var(--border2);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.7s linear infinite; margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.rally-error {
  padding: 1rem; background: var(--accent3-light); border: 1px solid var(--accent3);
  border-radius: var(--rs); font-size: 13px; color: var(--text2); margin: 8px 0;
}
.rally-raw-toggle {
  margin-top: 10px; font-size: 11px; color: var(--text3);
  cursor: pointer; text-decoration: underline;
}
.rally-raw { display: none; margin-top: 8px; }
.rally-raw.open { display: block; }

/* Back btn */
.back-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--text3); cursor: pointer; margin-bottom: 14px;
}
.back-btn:hover { color: var(--accent); }

/* Section label */
.sec-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--text3); margin: 1.25rem 0 8px;
}
.sec-label:first-child { margin-top: 0; }

/* View switch */
.view { display: none; }
.view.active { display: block; }

/* Home hierarchy */
.h-tree { display: flex; flex-direction: column; gap: 5px; margin-bottom: 1.25rem; }
.h-row {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 11px; border-radius: var(--rs); cursor: pointer;
}
.h-row:hover { opacity: 0.85; }
.h0 { background: var(--accent); color: #fff; }
.h1 { background: var(--accent-light); color: var(--accent); margin-left: 14px; }
.h2 { background: var(--surface2); color: var(--text); margin-left: 28px; }
.h3 { background: var(--surface2); color: var(--text2); margin-left: 42px; border: 1px solid var(--border); }
.h4 { background: var(--surface2); color: var(--text3); margin-left: 56px; border: 1px solid var(--border); font-size: 12px; }
.h-num { font-size: 15px; font-weight: 700; min-width: 32px; }
.h-lbl { font-size: 13px; }
.h-arr { margin-left: auto; opacity: 0.45; font-size: 11px; }

/* API key setup */
.api-setup {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 1rem; margin-bottom: 1rem;
}
.api-setup h3 { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.api-setup p { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
.api-setup input {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border2);
  border-radius: var(--rs); font-size: 13px; color: var(--text);
  background: var(--surface2); outline: none; margin-bottom: 8px;
}
.api-setup input:focus { border-color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: var(--rs); font-size: 13px;
  cursor: pointer; font-weight: 500; border: none; transition: opacity 0.13s;
}
.btn:hover { opacity: 0.88; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Thought shift badge */
.shift-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 2px 8px; border-radius: 20px;
  background: var(--accent2-light); color: var(--accent2);
  margin-top: 4px;
}

/* Stats */
.stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--rs); padding: 7px 14px; font-size: 12px; color: var(--text2);
}
.stat strong { font-size: 18px; font-weight: 700; color: var(--text); display: block; }
</style>
</head>
<body>
<div id="app">

  <!-- Overlay (mobile) -->
  <div id="overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sb-head">
      <h1>🧠 Second Brain</h1>
      <p id="sb-stats-line">読み込み中...</p>
    </div>
    <div class="sb-search">
      <input type="text" id="search-input" placeholder="検索..." oninput="handleSearch(this.value)">
    </div>
    <div id="sb-nav">
      <div class="nav0" onclick="nav('home')" id="nav-home">
        🌐 自己（ルート）
      </div>
      <div id="nav-tree"></div>
      <div style="height:6px"></div>
      <div class="nav0" onclick="nav('all-logs')" id="nav-all">
        📋 全ログ <span class="cnt" id="nav-all-cnt">—</span>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="mobile-bar">
      <button id="menu-btn" onclick="toggleSidebar()">☰</button>
      <span id="mobile-bar-title">🧠 Second Brain</span>
    </div>
    <div id="main-inner">

      <!-- HOME -->
      <div class="view active" id="view-home">
        <div class="pg-header">
          <div class="pg-title">自己</div>
          <div class="pg-sub">思考・探究・発見の進化ログ</div>
        </div>
        <div class="stat-row" id="home-stats"></div>
        <div class="h-tree" id="home-tree"></div>
        <div class="sec-label">集約概念</div>
        <div class="grid grid-3" id="home-concepts"></div>
      </div>

      <!-- CONCEPTS LIST -->
      <div class="view" id="view-concepts">
        <div class="pg-header">
          <div class="breadcrumb">
            <span onclick="nav('home')">自己</span>
            <span class="sep">›</span>
            <span>集約概念</span>
          </div>
          <div class="pg-title">6つの集約概念</div>
          <div class="pg-sub">あなたの思考を貫く根幹テーマ</div>
        </div>
        <div class="grid grid-3" id="concepts-grid"></div>
      </div>

      <!-- CONCEPT DETAIL (個別概念一覧) -->
      <div class="view" id="view-concept">
        <div class="back-btn" onclick="nav('concepts')">← 集約概念へ</div>
        <div class="pg-header" id="concept-header"></div>
        <div class="sec-label">個別概念</div>
        <div class="grid grid-2" id="concept-individuals"></div>
      </div>

      <!-- INDIVIDUAL (トピック＝ログ一覧) -->
      <div class="view" id="view-individual">
        <div class="back-btn" id="individual-back">← 戻る</div>
        <div class="pg-header" id="individual-header"></div>
        <div class="sec-label">関連会話</div>
        <div class="log-list" id="individual-logs"></div>
      </div>

      <!-- ALL LOGS -->
      <div class="view" id="view-all-logs">
        <div class="pg-header">
          <div class="pg-title">全ログ</div>
          <div class="pg-sub" id="all-logs-sub"></div>
        </div>
        <div class="log-list" id="all-logs-list"></div>
      </div>

      <!-- CONVERSATION (ラリー表示) -->
      <div class="view" id="view-conv">
        <div class="back-btn" id="conv-back">← 戻る</div>
        <div id="conv-content"></div>
      </div>

      <!-- SEARCH -->
      <div class="view" id="view-search">
        <div class="pg-header">
          <div class="pg-title">検索</div>
          <div class="pg-sub" id="search-sub"></div>
        </div>
        <div class="log-list" id="search-results"></div>
      </div>

    </div><!-- /main-inner -->
  </div><!-- /main -->
</div><!-- /app -->

<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  DATA_BASE: './data',          // logs.json, wiki_structure.json
  RAW_BASE: './raw',            // conversations-000.json etc.
  RALLY_CACHE_KEY: 'sb_rally_', // localStorage prefix
  API_KEY_STORAGE: 'sb_api_key',
  MODEL: 'claude-sonnet-4-6',
  RAW_FILES: [
    'conversations-000.json',
    'conversations-001.json',
    'conversations-002.json',
    'conversations-003.json',
    'conversations-004.json',
    'conversations-005.json',
    'conversations-006.json',
  ]
};

// ============================================================
// STATE
// ============================================================
let LOGS = [];          // logs.json
let WIKI = null;        // wiki_structure.json
let LOG_MAP = {};       // id → log
let IND_MAP = {};       // individual_id → individual
let CONCEPT_MAP = {};   // concept_id → concept
let RAW_CACHE = {};     // filename → parsed JSON (lazy)

let currentView = 'home';
let prevView = 'home';
let currentLogId = null;
let searchTimer = null;

// ============================================================
// INIT
// ============================================================
async function init() {
  try {
    const [logsRes, wikiRes] = await Promise.all([
      fetch(`${CONFIG.DATA_BASE}/logs.json`),
      fetch(`${CONFIG.DATA_BASE}/wiki_structure.json`)
    ]);
    LOGS = await logsRes.json();
    WIKI = await wikiRes.json();
  } catch(e) {
    // ファイルが見つからない場合はエラー表示
    document.getElementById('main-inner').innerHTML = `
      <div style="padding:2rem;color:var(--text2)">
        <h2 style="margin-bottom:8px">⚠️ データファイルが見つかりません</h2>
        <p style="font-size:13px;line-height:1.7">
          <code>data/logs.json</code> と <code>data/wiki_structure.json</code> が必要です。<br>
          <code>index.html</code> と同じディレクトリに <code>data/</code> フォルダを配置してください。
        </p>
      </div>`;
    return;
  }

  // マップ構築
  LOGS.forEach(l => { LOG_MAP[l.id] = l; });
  WIKI.concepts.forEach(c => {
    CONCEPT_MAP[c.id] = c;
    c.children.forEach(i => { IND_MAP[i.id] = { ...i, concept: c }; });
  });

  // UI構築
  buildNav();
  renderHome();
  renderAllLogs();
  renderConceptsGrid();
  updateSbStats();
}

// ============================================================
// NAV TREE
// ============================================================
function buildNav() {
  const tree = document.getElementById('nav-tree');
  let html = '';
  WIKI.concepts.forEach((c, ci) => {
    const total = c.children.reduce((a, ch) => a + ch.logIds.length, 0);
    html += `
      <div class="nav1" onclick="navConceptToggle(${ci},'${c.id}',event)" id="nav1-${c.id}">
        <span class="chev" id="chev-${ci}">▶</span>
        ${c.emoji} ${c.label}
        <span class="cnt">${total}</span>
      </div>

async function showConv(id, fromView) {
  currentLogId = id;
  prevView = fromView || currentView;
  const l = LOG_MAP[id];
  if (!l) return;

  document.getElementById('conv-back').onclick = () => showView(prevView);
  document.getElementById('conv-back').textContent = `← ${viewLabel(prevView)}`;

  // 所属概念チップ
  const chips = (l.memberships || []).map(m =>
    `<span class="membership-chip" onclick="navIndividual('${m.individual_id}')">
      ${m.concept_emoji} ${m.individual_label}
    </span>`).join('');

  document.getElementById('conv-content').innerHTML = `
    <div class="conv-header">
      <div class="conv-title">${l.title}</div>
      <div class="conv-meta">
        <span>📅 ${l.date}</span>
        <span>${(l.memberships||[]).length}個のノードに所属</span>
      </div>
      <div class="conv-memberships">${chips}</div>
    </div>
    <div id="rally-area">
      <div class="rally-loading"><div class="spinner"></div>ラリーを読み込んでいます...</div>
    </div>`;

  showView('conv');

  // キャッシュ確認
  const cached = localStorage.getItem(CONFIG.RALLY_CACHE_KEY + id);
  if (cached) {
    try {
      renderRallies(JSON.parse(cached), id);
      return;
    } catch(e) { localStorage.removeItem(CONFIG.RALLY_CACHE_KEY + id); }
  }

  // 生データ取得
  const rawMessages = await loadRawMessages(id);
  if (!rawMessages || rawMessages.length === 0) {
    document.getElementById('rally-area').innerHTML =
      renderRalliesFromRaw(null, l.preview);
    return;
  }

  // APIキー確認
  const apiKey = localStorage.getItem(CONFIG.API_KEY_STORAGE);
  if (!apiKey) {
    document.getElementById('rally-area').innerHTML = renderApiSetup(id, rawMessages);
    return;
  }

  // API生成
  await generateRallySummaries(id, rawMessages, apiKey);
}

// ============================================================
// RAW DATA LOADER
// ============================================================
async function loadRawMessages(logId) {
  // どのファイルにあるか探す
  for (const filename of CONFIG.RAW_FILES) {
    if (!RAW_CACHE[filename]) {
      try {
        const res = await fetch(`${CONFIG.RAW_BASE}/${filename}`);
        if (!res.ok) continue;
        RAW_CACHE[filename] = await res.json();
      } catch(e) { continue; }
    }
    const data = RAW_CACHE[filename];
    const conv = data.find(c => c.id === logId);
    if (!conv) continue;

    const msgs = [];
    for (const node of Object.values(conv.mapping || {})) {
      const msg = node.message;
      if (!msg) continue;
      const role = msg.author?.role;
      if (!['user', 'assistant'].includes(role)) continue;
      const parts = msg.content?.parts || [];
      const text = parts.filter(p => typeof p === 'string').join(' ').trim();
      if (text) msgs.push({ role, text, time: msg.create_time || 0 });
    }
    msgs.sort((a, b) => a.time - b.time);
    return msgs;
  }
  return null;
}

// ============================================================
// RENDER RALLIES (from cache)
// ============================================================
function renderRallies(rallies, logId) {
  const area = document.getElementById('rally-area');
  if (!rallies || rallies.length === 0) {
    area.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:1rem">ラリーデータなし</div>';
    return;
  }

  let html = `<div class="rally-timeline">`;
  rallies.forEach((r, i) => {
    const hasShift = r.thought_shift && r.thought_shift !== '—';
    html += `
      <div class="rally-item" id="rally-${logId}-${i}">
        <div class="rally-header" onclick="toggleRally('${logId}',${i})">
          <span class="rally-num">ラリー ${i+1}</span>
          <span class="rally-summary">${r.summary || ''}</span>
          <span class="rally-toggle" id="rtog-${logId}-${i}">▼ 展開</span>
        </div>
        <div class="rally-body" id="rbody-${logId}-${i}">
          <div class="turn turn-user">
            <div class="turn-label">🧑 あなたの問い</div>
            <div class="turn-bubble">${escHtml(r.user_question || '')}</div>
          </div>
          <div class="turn turn-ai">
            <div class="turn-label">🤖 AIの応答</div>
            <div class="turn-bubble">${escHtml(r.ai_response_summary || '')}</div>
          </div>
          ${r.key_insight ? `<div class="rally-insight">
            <strong>💡 論点・発見</strong>
            ${escHtml(r.key_insight)}
          </div>` : ''}
          ${hasShift ? `<div class="shift-badge">🔄 ${escHtml(r.thought_shift)}</div>` : ''}
          ${r.user_full ? `
            <div class="rally-raw-toggle" onclick="toggleRaw('${logId}',${i})">📜 元の発言を見る</div>
            <div class="rally-raw" id="rraw-${logId}-${i}">
              <div class="turn turn-user" style="margin-bottom:8px">
                <div class="turn-label">元発言（ユーザー）</div>
                <div class="turn-bubble" style="font-size:12px;white-space:pre-wrap">${escHtml(r.user_full)}</div>
              </div>
              ${r.ai_full ? `<div class="turn turn-ai">
                <div class="turn-label">元発言（AI）</div>
                <div class="turn-bubble" style="font-size:12px;white-space:pre-wrap">${escHtml(r.ai_full.substring(0,2000))}${r.ai_full.length>2000?'…':''}</div>
              </div>` : ''}
            </div>` : ''}
        </div>
      </div>`;
  });
  html += `</div>`;
  area.innerHTML = html;
}

// ============================================================
// RENDER WITHOUT RALLY SUMMARIES (fallback)

// ============================================================
// API SETUP UI
// ============================================================
function renderApiSetup(logId, rawMessages) {
  return `
    <div class="api-setup">
      <h3>🔑 Anthropic APIキーを設定してください</h3>
      <p>ラリー要約の生成にはAnthropicのAPIキーが必要です。<br>
      キーはブラウザのlocalStorageにのみ保存されます（外部送信なし）。<br>
      一度生成した要約はキャッシュされ、次回以降はAPIを使いません。</p>
      <input type="password" id="api-key-input" placeholder="sk-ant-..." />
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="saveApiKeyAndGenerate('${logId}')">保存して生成</button>
        <button class="btn btn-ghost" onclick="showRawFallback('${logId}')">要約なしで表示</button>
      </div>
    </div>
    <div id="raw-preview-${logId}"></div>`;
}

async function saveApiKeyAndGenerate(logId) {
  const key = document.getElementById('api-key-input')?.value?.trim();
  if (!key) return;
  localStorage.setItem(CONFIG.API_KEY_STORAGE, key);
  document.getElementById('rally-area').innerHTML =
    '<div class="rally-loading"><div class="spinner"></div>ラリー要約を生成中...</div>';
  const rawMessages = await loadRawMessages(logId);
  await generateRallySummaries(logId, rawMessages, key);
}

function showRawFallback(logId) {
  loadRawMessages(logId).then(msgs => {
    if (!msgs) return;
    // ペアに分けてシンプル表示
    const pairs = [];
    for (let i = 0; i < msgs.length; i += 2) {
      pairs.push({ user: msgs[i], ai: msgs[i+1] });
    }
    const rallies = pairs.map(p => ({
      summary: p.user?.text?.substring(0,60) + '...',
      user_question: p.user?.text || '',
      ai_response_summary: p.ai?.text?.substring(0,200) || '',
      user_full: p.user?.text || '',
      ai_full: p.ai?.text || '',
      key_insight: null,
      thought_shift: null,
    }));
    renderRallies(rallies, logId);
  });
}

// ============================================================
// API CALL: GENERATE RALLY SUMMARIES
// ============================================================
async function generateRallySummaries(logId, rawMessages, apiKey) {
  const area = document.getElementById('rally-area');
  if (!rawMessages || rawMessages.length === 0) {
    area.innerHTML = '<div style="color:var(--text3);padding:1rem">メッセージデータが見つかりませんでした</div>';
    return;
  }

  // ペアに分ける（user→assistant を1ラリー）
  const pairs = [];
  let i = 0;
  while (i < rawMessages.length) {
    if (rawMessages[i].role === 'user') {
      const user = rawMessages[i];
      const ai = rawMessages[i+1]?.role === 'assistant' ? rawMessages[i+1] : null;
      pairs.push({ user, ai });
      i += ai ? 2 : 1;
    } else { i++; }
  }

  // 1ラリーあたりのテキストを1500字以内に切る
  const pairTexts = pairs.map((p, idx) =>
    `ラリー${idx+1}:\nユーザー: ${p.user.text.substring(0, 800)}\nAI: ${p.ai ? p.ai.text.substring(0, 800) : '(なし)'}`
  ).join('\n\n---\n\n');

  const prompt = `以下は1つの会話の全ラリー（やりとり）です。各ラリーについて以下のフォーマットのJSONを生成してください。

【会話全体】
${pairTexts.substring(0, 6000)}

【出力形式】
JSONの配列で、各要素は以下のキーを持つ:
- "summary": そのラリーの1行要約（20〜40字）
- "user_question": ユーザーの問いや主張を1〜3文で要約
- "ai_response_summary": AIの応答の要点を1〜3文で要約
- "key_insight": そのラリーで生まれた論点・発見（なければnull）
- "thought_shift": 思考の変化・フレーム転換があれば一言で（なければ"—"）

JSONのみ出力し、説明文は不要。`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: CONFIG.MODEL,
        max_tokens: 4000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || response.statusText);
    }

    const data = await response.json();
    const text = data.content.map(b => b.text || '').join('');
    const jsonMatch = text.match(/\[[\s\S]*\]/);
    if (!jsonMatch) throw new Error('JSON not found in response');

    const summaries = JSON.parse(jsonMatch[0]);

    // 元テキストも付加してキャッシュ
    const rallies = summaries.map((s, idx) => ({
      ...s,
      user_full: pairs[idx]?.user?.text || '',
      ai_full: pairs[idx]?.ai?.text || '',
    }));

    localStorage.setItem(CONFIG.RALLY_CACHE_KEY + logId, JSON.stringify(rallies));
    renderRallies(rallies, logId);

    // ホームのキャッシュ数を更新
    document.querySelectorAll('.stat')[3]?.querySelector('strong') &&
      (document.querySelectorAll('.stat')[3].querySelector('strong').textContent =
        Object.keys(localStorage).filter(k => k.startsWith(CONFIG.RALLY_CACHE_KEY)).length);

  } catch(e) {
    area.innerHTML = `
      <div class="rally-error">
        ⚠️ ラリー生成エラー: ${escHtml(e.message)}<br>
        <small>APIキーを確認してください</small>
      </div>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="showRawFallback('${logId}')">要約なしで表示</button>
      <button class="btn btn-ghost" style="margin-top:8px;margin-left:6px" onclick="localStorage.removeItem('${CONFIG.API_KEY_STORAGE}');showConv('${logId}','${prevView}')">APIキー再設定</button>`;
  }
}

function toggleRally(logId, idx) {
  const body = document.getElementById(`rbody-${logId}-${idx}`);
  const tog = document.getElementById(`rtog-${logId}-${idx}`);
  const isOpen = body.classList.toggle('open');
  tog.textContent = isOpen ? '▲ 閉じる' : '▼ 展開';
  tog.classList.toggle('open', isOpen);
}

function toggleRaw(logId, idx) {
  document.getElementById(`rraw-${logId}-${idx}`)?.classList.toggle('open');
}

// ============================================================
// SEARCH
// ============================================================
function handleSearch(q) {
  clearTimeout(searchTimer);
  if (!q.trim()) { if (currentView === 'search') showView('home'); return; }
  searchTimer = setTimeout(() => doSearch(q), 200);
}

function doSearch(q) {
  const ql = q.toLowerCase();
  const results = LOGS.filter(l =>
    l.title.toLowerCase().includes(ql) ||
    (l.preview||'').toLowerCase().includes(ql) ||
    (l.memberships||[]).some(m => m.individual_label.toLowerCase().includes(ql) || m.concept_label.toLowerCase().includes(ql))
  );
  document.getElementById('search-sub').textContent = `"${q}" — ${results.length}件`;
  document.getElementById('search-results').innerHTML = results.map(l => logRow(l, 'search')).join('') ||
    '<div style="color:var(--text3);padding:1rem">該当なし</div>';
  showView('search');
}

  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function viewLabel(v) {
  return { home:'ホーム', concepts:'集約概念', concept:'概念', individual:'個別概念',
    'all-logs':'全ログ', search:'検索', conv:'会話' }[v] || '戻る';
}
